name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit - Verify Service Role Key Isolation
        shell: bash
        run: |
          echo "Verifying SUPABASE_SERVICE_ROLE_KEY is strictly confined to apps/api..."
          # Tracked files outside apps/api, docs, workflows, Markdown and .env.example templates.
          # (grep --exclude-dir matches folder names only, so "apps/api" never excluded anything.)
          VIOLATIONS=$(git grep -n "SUPABASE_SERVICE_ROLE_KEY" -- . \
            ':!apps/api' ':!docs' ':!.github' ':!*.md' ':!*.env.example' \
            ':!supabase/seed' || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY detected outside apps/api:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "PASSED: SUPABASE_SERVICE_ROLE_KEY is strictly confined to apps/api."

      - name: Dependency audit (high and above)
        run: pnpm audit --prod --audit-level high

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Run Turborepo Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:3002
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
