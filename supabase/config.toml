# Gunita Kopi Supabase CLI Configuration

project_id = "gunita-kopi-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
port = 54324
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false

# Owner sign-in: password, then a 6-digit code from the Magic Link email (signInWithOtp), valid
# 5 minutes and single use. apps/api approves only sessions created through its challenge.
[auth.email]
otp_length = 6
otp_expiry = 300
max_frequency = "60s"

# Optional real delivery through Resend (resend.com, free), set in supabase/.env (gitignored,
# copy supabase/.env.example first; `supabase start` needs that file):
#   SMTP_ENABLED=false  -> codes go to the local inbox, http://127.0.0.1:54326 (default)
#   SMTP_ENABLED=true and SMTP_PASS=<Resend API key> -> real email. With the onboarding@resend.dev
#   sender, Resend delivers only to the email the Resend account was created with.
[auth.email.smtp]
enabled = "env(SMTP_ENABLED)"
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(SMTP_PASS)"
admin_email = "onboarding@resend.dev"
sender_name = "Gunita Kopi"

[auth.email.template.magic_link]
subject = "Your Gunita Kopi sign-in code"
content_path = "./supabase/templates/owner-sign-in-code.html"

# No authenticator apps: the second step is the emailed code.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true
port = 54323
file_size_limit = "50MiB"

[studio]
enabled = true
port = 54325

[inbucket]
enabled = true
port = 54326
