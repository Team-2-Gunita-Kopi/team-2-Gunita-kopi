# Gunita Kopi Supabase CLI Configuration

project_id = "gunita-kopi-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
port = 54324
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false

# Owner sign-in needs a second step (SDS 2.4); the API refuses an Owner session below aal2.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
port = 54323
file_size_limit = "50MiB"

[studio]
enabled = true
port = 54325

[inbucket]
enabled = true
port = 54326
